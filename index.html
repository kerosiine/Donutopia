<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Donutopia — пончики с доставкой</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('images/fon.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        body.no-bg-image::before {
            content: "";
            background: linear-gradient(145deg, #fdf8f0, #fff4e6);
            opacity: 1;
        }

        :root {
            --bg-body: #fef9f2;
            --bg-surface: #ffffffdd;
            --bg-card: #ffffffdd;
            --text-main: #2d2a24;
            --text-muted: #6b6258;
            --border: #f0e2d4;
            --primary: #e85d4f;
            --primary-dark: #c13e30;
            --primary-light: #ffedea;
            --header-bg: #ffffffcc;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 20px 30px -12px rgba(0, 0, 0, 0.1);
            --accent-soft: #fdebd0;
        }

        body.dark {
            --bg-body: #1e1b18;
            --bg-surface: #2c2824cc;
            --bg-card: #2c2824cc;
            --text-main: #f0ece6;
            --text-muted: #bcb2a6;
            --border: #3e3832;
            --primary-light: #442e2a;
            --header-bg: #2c2824cc;
            --accent-soft: #3e2a24;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 2;
        }

        /* АНИМАЦИИ */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-3px);
            }

            75% {
                transform: translateX(3px);
            }
        }

        @keyframes glow {
            0% {
                box-shadow: 0 0 5px rgba(232, 93, 79, 0.3);
            }
            50% {
                box-shadow: 0 0 20px rgba(232, 93, 79, 0.6);
            }
            100% {
                box-shadow: 0 0 5px rgba(232, 93, 79, 0.3);
            }
        }

        .donut-card,
        .set-card,
        .feature,
        .news-card {
            animation: fadeInUp 0.5s ease-out;
            animation-fill-mode: backwards;
        }

        .donut-card:nth-child(1) {
            animation-delay: 0.05s;
        }

        .donut-card:nth-child(2) {
            animation-delay: 0.1s;
        }

        .donut-card:nth-child(3) {
            animation-delay: 0.15s;
        }

        .donut-card:nth-child(4) {
            animation-delay: 0.2s;
        }

        .donut-card:nth-child(5) {
            animation-delay: 0.25s;
        }

        .donut-card:nth-child(6) {
            animation-delay: 0.3s;
        }

        .header {
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
            transition: all 0.3s ease;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: nowrap;
            gap: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #e85d4f, #f4a261);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.02);
            letter-spacing: 1px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-surface);
            border-radius: 40px;
            padding: 6px 16px;
            border: 1px solid var(--border);
            gap: 8px;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(232, 93, 79, 0.2);
            transform: scale(1.02);
        }

        .search-box input {
            background: transparent;
            border: none;
            padding: 6px 0;
            font-size: 0.85rem;
            width: 160px;
            outline: none;
            color: var(--text-main);
        }

        .search-box button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--primary);
            transition: all 0.3s ease;
        }

        .search-box button:hover {
            transform: scale(1.1);
            color: var(--primary-dark);
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: nowrap;
            flex-shrink: 1;
        }

        .nav a {
            font-weight: 500;
            color: var(--text-main);
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav a:hover {
            color: var(--primary);
            transform: translateY(-2px);
        }

        .nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .nav a:hover::after {
            width: 100%;
        }

        .nav a.hidden-link {
            display: none;
        }

        .theme-toggle {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 6px 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            border-color: var(--primary);
            animation: pulse 0.5s ease;
        }

        @media (max-width: 1100px) {
            .header-inner {
                gap: 12px;
            }

            .nav {
                gap: 14px;
            }

            .search-box input {
                width: 120px;
            }

            .logo {
                font-size: 1.4rem;
            }
        }

        @media (max-width: 900px) {
            .header-inner {
                flex-wrap: wrap;
            }

            .nav {
                flex-wrap: wrap;
                justify-content: center;
                margin-top: 8px;
            }
        }

        .btn {
            background: var(--primary);
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(232, 93, 79, 0.3);
            animation: glow 1.5s infinite;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .donut-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 32px;
            margin: 30px 0;
        }

        .donut-card,
        .set-card {
            background: var(--bg-card);
            border-radius: 32px;
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid var(--border);
            backdrop-filter: blur(4px);
        }

        .donut-card:hover,
        .set-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: var(--shadow-hover);
        }

        .card-img {
            height: 220px;
            background-size: cover;
            background-position: center;
            transition: transform 0.5s ease;
        }

        .donut-card:hover .card-img,
        .set-card:hover .card-img {
            transform: scale(1.05);
        }
.donut-card, .set-card {
    background: var(--bg-card);
    border-radius: 32px;
    overflow: hidden;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border: 1px solid var(--border);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    height: 100%;
}

.card-content {
    padding: 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
}

.donut-title {
    font-size: 1.35rem;
    font-weight: 700;
    transition: color 0.3s ease;
    margin-bottom: 8px;
}

.donut-desc {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-bottom: 12px;
    flex: 1;
}

.price-wrapper {
    margin-top: auto;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
}

.price {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--primary);
}

.old-price {
    font-size: 1rem;
    text-decoration: line-through;
    color: var(--text-muted);
}

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin: 48px 0 20px;
            border-left: 6px solid var(--primary);
            padding-left: 20px;
            transition: all 0.3s ease;
        }

        .section-title:hover {
            transform: translateX(10px);
            border-left-width: 10px;
        }

        .category-buttons {
            display: flex;
            gap: 16px;
            margin: 30px 0 20px;
            flex-wrap: wrap;
        }

        .cat-btn {
            background: transparent;
            border: 2px solid var(--primary);
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            color: var(--primary);
            transition: all 0.3s ease;
        }

        .cat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(232, 93, 79, 0.2);
        }

        .cat-btn.active {
            background: var(--primary);
            color: white;
        }

        .features {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin: 50px 0;
            flex-wrap: wrap;
        }

        .feature {
            text-align: center;
            flex: 1;
            min-width: 160px;
            background: var(--bg-surface);
            border-radius: 30px;
            padding: 24px 12px;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }

        .feature:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
        }

        .feature i {
            font-size: 2.5rem;
            color: var(--primary);
            transition: all 0.3s ease;
            display: inline-block;
        }

        .feature:hover i {
            transform: scale(1.1) rotate(5deg);
            animation: pulse 0.5s ease;
        }

        footer {
            background: var(--bg-surface);
            margin-top: 70px;
            padding: 40px 0;
            border-top: 1px solid var(--border);
            backdrop-filter: blur(4px);
        }

        .footer-grid {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 30px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeInUp 0.3s ease;
        }

        .modal-content {
            background: var(--bg-surface);
            border-radius: 36px;
            max-width: 550px;
            width: 90%;
            padding: 28px;
            max-height: 85vh;
            overflow-y: auto;
        }

        #devModal .modal-content {
            overflow-y: visible;
            max-height: none;
        }

        .detail-img {
            height: 250px;
            background-size: cover;
            background-position: center;
            border-radius: 28px;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .detail-img:hover {
            transform: scale(1.02);
        }

        .detail-actions {
            display: flex;
            gap: 16px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .fav-detail-btn {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 10px 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .fav-detail-btn:hover {
            transform: scale(1.05);
            border-color: var(--primary);
            color: var(--primary);
        }

        .news-card {
            background: var(--bg-surface);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }

        .news-card:hover {
            transform: translateX(10px);
            box-shadow: var(--shadow-hover);
        }

        .news-img {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .news-card:hover .news-img {
            transform: scale(1.05);
        }

        /* Стили для страницы аккаунта */
        .account-card {
            background: var(--bg-surface);
            border-radius: 32px;
            padding: 35px;
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .account-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .account-avatar {
            width: 100px;
            height: 100px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            transition: all 0.3s ease;
        }

        .account-avatar i {
            font-size: 60px;
            color: var(--primary);
        }

        .account-avatar:hover {
            transform: scale(1.05);
        }

        .account-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .account-email {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .support-form-container {
            background: var(--bg-surface);
            border-radius: 40px;
            padding: 35px;
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            max-width: 700px;
            margin: 0 auto;
            transition: all 0.3s ease;
        }

        .support-form-container:hover {
            box-shadow: var(--shadow-hover);
        }

        .support-form-group {
            margin-bottom: 24px;
        }

        .support-form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .support-form-group:hover label {
            color: var(--primary);
        }

        .support-form-group input,
        .support-form-group select,
        .support-form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border-radius: 28px;
            border: 1px solid var(--border);
            background: var(--bg-body);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .support-form-group input:focus,
        .support-form-group select:focus,
        .support-form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(232, 93, 79, 0.1);
            transform: translateY(-2px);
        }

        .support-form-group textarea {
            resize: vertical;
            min-height: 130px;
        }

        .support-success {
            background: #4caf50;
            color: white;
            padding: 14px;
            border-radius: 28px;
            text-align: center;
            margin-top: 20px;
            animation: fadeInUp 0.5s ease;
        }

        .dev-card {
            text-align: center;
        }

        .dev-photo {
            width: 120px;
            height: 120px;
            border-radius: 60px;
            object-fit: cover;
            border: 4px solid var(--primary);
            margin: 0 auto 20px;
            display: block;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .dev-photo:hover {
            transform: scale(1.05) rotate(3deg);
        }

        .dev-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 10px 0 5px;
            background: linear-gradient(135deg, var(--primary), #f4a261);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .dev-specialty {
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 20px;
        }

        .dev-table {
            width: 100%;
            margin: 20px 0;
            border-collapse: collapse;
        }

        .dev-table tr {
            border-bottom: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .dev-table tr:hover {
            background: var(--primary-light);
        }

        .dev-table td {
            padding: 12px 8px;
            text-align: left;
        }

        .dev-table td:first-child {
            font-weight: 600;
            width: 40%;
            color: var(--primary);
        }

        .dev-badge {
            background: var(--primary-light);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .dev-badge:hover {
            transform: scale(1.05);
            animation: pulse 0.5s ease;
        }

        .login-container {
            max-width: 480px;
            margin: 40px auto;
            background: var(--bg-surface);
            border-radius: 48px;
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            overflow: hidden;
            animation: fadeInUp 0.5s ease;
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary), #f4a261);
            padding: 30px 20px;
            text-align: center;
        }

        .login-header i {
            font-size: 3.5rem;
            color: white;
            margin-bottom: 10px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        .login-header h2 {
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .login-form {
            padding: 35px;
        }

        .input-group {
            margin-bottom: 24px;
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 1.1rem;
            z-index: 1;
        }

        .input-group input {
            width: 100%;
            padding: 16px 18px 16px 48px;
            border-radius: 40px;
            border: 2px solid var(--border);
            background: var(--bg-body);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            color: var(--text-main);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(232, 93, 79, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .login-footer {
            text-align: center;
            padding: 20px 35px 35px;
            border-top: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.02);
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px 18px;
            border-radius: 40px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            text-align: center;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-surface);
            border-radius: 24px;
            padding: 16px 20px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            backdrop-filter: blur(4px);
            flex-wrap: wrap;
            gap: 15px;
            transition: all 0.3s ease;
        }

        .cart-item:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow);
        }

        .cart-item-image {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .cart-item:hover .cart-item-image {
            transform: scale(1.05);
        }

        .cart-item-info {
            flex: 2;
            min-width: 150px;
        }

        .cart-item-name {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .cart-item-price {
            color: var(--primary);
            font-weight: 600;
        }

            currentUser = {

            const email = currentUser?.email;

                localStorage.removeItem(`donut_cart_${email}`);

            updateAuthUI();

        function updateAuthUI() {
            const loginBtn = document.getElementById('loginRegisterBtn');

            const accountLink = document.getElementById('accountLink');

            if (isAuthenticated()) {
                // В шапке просто "Аккаунт", без имени пользователя
                if (loginBtn) loginBtn.classList.add('hidden-link');
                if (cartLink) cartLink.classList.remove('hidden-link');

                if (supportLink) supportLink.classList.remove('hidden-link');
                if (accountLink) accountLink.classList.remove('hidden-link');
            } else {
                if (loginBtn) loginBtn.classList.remove('hidden-link');
                if (cartLink) cartLink.classList.add('hidden-link');
                if (favLink) favLink.classList.add('hidden-link');
                if (supportLink) supportLink.classList.add('hidden-link');
                if (accountLink) accountLink.classList.add('hidden-link');
            }
        }

        let cart = [],
            favorites = [];

        function loadUserData() {
            if (isAuthenticated()) {
                cart = JSON.parse(localStorage.getItem(`donut_cart_${currentUser.email}`)) || [];
                favorites = JSON.parse(localStorage.getItem(`donut_favs_${currentUser.email}`)) || [];
            } else {
                cart = [];
                favorites = [];
            }
            updateCartBadge();
        }

        function saveCart() {
            if (isAuthenticated()) localStorage.setItem(`donut_cart_${currentUser.email}`, JSON.stringify(cart));
            updateCartBadge();
        }

        function saveFavs() {
            if (isAuthenticated()) localStorage.setItem(`donut_favs_${currentUser.email}`, JSON.stringify(favorites));
        }

        function updateCartBadge() {
            let total = cart.reduce((s, i) => s + i.quantity, 0);
            let span = document.getElementById('cartCounter');
            if (span) span.innerHTML = total ? `(${total})` : '';
        }

        function addToCart(id, isSet = false) {
            if (!isAuthenticated()) {
                alert("🔐 Войдите");
                setPage('login');
                return false;
            }
            let item = cart.find(i => i.id === id && i.isSet === isSet);
            if (item) item.quantity++;
            else cart.push({
                id,
                quantity: 1,
                isSet
            });
            saveCart();
            alert("✅ Добавлено в корзину!");
            return true;
        }

        function removeFromCart(id, isSet) {
            cart = cart.filter(i => !(i.id === id && i.isSet === isSet));
            saveCart();
            renderCurrentPage();
        }

        function updateQuantity(id, delta, isSet) {
            let item = cart.find(i => i.id === id && i.isSet === isSet);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) removeFromCart(id, isSet);
                else saveCart();
                renderCurrentPage();
            }
        }

        function toggleFavorite(id, isSet = false) {
            if (!isAuthenticated()) {
                alert("🔐 Войдите");
                setPage('login');
                return;
            }
            const key = `${id}_${isSet}`;
            if (favorites.includes(key)) favorites = favorites.filter(f => f !== key);
            else favorites.push(key);
            saveFavs();
            if (selectedItem && selectedItem.id === id && selectedItem.isSet === isSet) {
                const favBtn = document.getElementById('modalFavBtn');
                if (favBtn) favBtn.innerHTML = favorites.includes(key) ? '<i class="fas fa-heart"></i> В избранном' : '<i class="far fa-heart"></i> В избранное';
            }
            renderCurrentPage();
        }

            return isSet ? sets.find(s => s.id === id) : donuts.find(d => d.id === id);

            if (!isAuthenticated()) {
                alert("🔐 Войдите");
                setPage('login');
                return;

            const item = getItemById(id, isSet);
            if (!item) return;
            selectedItem = {
                ...item,
                isSet
            };

            let itemsHtml = cart.map(i => {

                return `<div class="cart-item">

                    <button class="cart-remove" data-id="${i.id}" data-set="${i.isSet}"><i class="fas fa-trash-alt"></i></button>
                </div>`;
            }).join('');
            return `<div class="section-title">🛒 Корзина</div>${itemsHtml}<div class="cart-summary"><div style="font-size:1.6rem; font-weight:700;">Итого: ${total.toFixed(2)} Br</div><div style="margin-top:20px; display:flex; gap:15px; justify-content:flex-end; flex-wrap:wrap;"><button class="btn" id="goToCheckoutBtn">Оформить заказ →</button><button class="clear-cart-btn" id="clearCartBtn"><i class="fas fa-trash-alt"></i> Очистить корзину</button></div></div>`;
        }

        function renderCheckout() {
            if (!isAuthenticated() || cart.length === 0) {
                setPage('cart');
                return '';
            }
            let total = cart.reduce((s, i) => s + (getItemById(i.id, i.isSet)?.price || 0) * i.quantity, 0);
            return `<div class="section-title">📦 Оформление заказа</div><div style="display:grid; grid-template-columns:1fr 1fr; gap:30px;"><div style="background:var(--bg-surface); border-radius:32px; padding:28px;"><h3>Данные доставки</h3><form id="deliveryForm" class="checkout-form"><input type="text" id="fullName" placeholder="Ваше имя" required><input type="tel" id="phone" placeholder="Телефон" required><input type="text" id="address" placeholder="Адрес" required><select id="deliveryType"><option value="city">По городу (3 Br)</option><option value="out">За город (5 Br)</option></select><input type="date" id="deliveryDate" value="${new Date().toISOString().split('T')[0]}"><select id="paymentMethod"><option value="card">Карта онлайн</option><option value="cash">Наличные курьеру</option></select><button type="submit" class="btn">✅ Подтвердить заказ</button></form></div><div style="background:var(--bg-surface); border-radius:32px; padding:28px;"><h3>Ваш заказ</h3>${cart.map(i => {
                let d = getItemById(i.id, i.isSet);
                return `<div>${d.name} x${i.quantity} — ${(d.price * i.quantity).toFixed(2)} Br</div>`;
            }).join('')}<hr><div><strong>Доставка: <span id="deliveryCost">3 Br</span></strong></div><div style="font-size:1.4rem;"><strong>Итого: <span id="totalCost">${(total + 3).toFixed(2)} Br</span></strong></div></div></div>`;
        }

        function renderFavorites() {
            if (!isAuthenticated()) return ``;
            let favItems = favorites.map(key => {
                let [id, isSet] = key.split('_');
                return {
                    ...getItemById(parseInt(id), isSet === 'true'),
                    isSet: isSet === 'true'
                };
            }).filter(i => i);
            if (favItems.length === 0) return `<div style="text-align:center; padding:60px;"><i class="far fa-heart fa-3x"></i><h3>Нет избранного</h3><button class="btn" id="toHomeFav">На главную</button></div>`;
            return `<div class="section-title">❤️ Избранное</div><div class="donut-grid">${favItems.map(i => `<div class="donut-card" data-id="${i.id}" data-set="${i.isSet}"><div class="card-img" style="background-image: url('${i.image}');"></div><div class="card-content"><div class="donut-title">${i.name}</div><div class="price">${i.price.toFixed(2)} Br</div></div></div>`).join('')}</div>`;
        }

        function renderNews() {
            return `<div class="section-title">📰 Новости</div>${newsItems.map(n => `<div class="news-card"><div class="news-img" style="background-image:url('${n.img}');"></div><div><h3>${n.title}</h3><p>${n.date}</p><p>${n.desc}</p></div></div>`).join('')}`;
        }

        function renderAbout() {
    return `
        <div class="about-hero">
            <h1>🍩 Donutopia</h1>
            <p style="font-size:1.2rem; max-width:700px; margin:0 auto;">Мы создаём пончики, которые дарят радость с 2020 года. Натуральные ингредиенты, ручная работа и любовь в каждом укусе.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number">5+</div><div class="stat-label">лет на рынке</div></div>
            <div class="stat-card"><div class="stat-number">50 000+</div><div class="stat-label">счастливых клиентов</div></div>
            <div class="stat-card"><div class="stat-number">15</div><div class="stat-label">видов начинок</div></div>
            <div class="stat-card"><div class="stat-number">30 мин</div><div class="stat-label">среднее время доставки</div></div>
        </div>

        <div class="section-title">✨ Наши преимущества</div>
        <div class="about-grid">
            <div class="about-card"><i class="fas fa-hand-holding-heart"></i><h3>Ручная работа</h3><p>Каждый пончик создаётся вручную нашими кондитерами с душой и вниманием к деталям.</p></div>
            <div class="about-card"><i class="fas fa-leaf"></i><h3>Натуральные ингредиенты</h3><p>Используем только свежие продукты без консервантов и искусственных добавок.</p></div>
            <div class="about-card"><i class="fas fa-truck-fast"></i><h3>Быстрая доставка</h3><p>Доставляем по всему городу за 30-40 минут. Горячие пончики прямо к вашему столу.</p></div>
            <div class="about-card"><i class="fas fa-percent"></i><h3>Акции и скидки</h3><p>Регулярные акции, скидки для постоянных клиентов и подарки к большим заказам.</p></div>
        </div>

        <div class="section-title">🌟 Наши ценности</div>
        <div class="values-grid">
            <div class="value-card"><i class="fas fa-smile"></i><h3>Качество</h3><p>Тщательно следим за качеством каждого пончика, от замеса теста до финальной глазури.</p></div>
            <div class="value-card"><i class="fas fa-heart"></i><h3>Забота о клиентах</h3><p>Для нас каждый клиент — особенный. Мы всегда готовы учесть ваши пожелания.</p></div>
            <div class="value-card"><i class="fas fa-lightbulb"></i><h3>Креативность</h3><p>Постоянно придумываем новые вкусы и удивляем вас необычными сочетаниями.</p></div>
        </div>

        <div class="section-title">💬 Отзывы наших клиентов</div>
        <div class="reviews-grid">
            <div class="review-card"><div class="review-stars">★★★★★</div><div class="review-text">"Лучшие пончики в городе! Очень нежные, начинки просто божественные. Доставка быстрая, курьеры вежливые. Рекомендую!"</div><div class="review-author">— Екатерина С.</div></div>
            <div class="review-card"><div class="review-stars">★★★★★</div><div class="review-text">"Заказывал набор "Вечеринка" на день рождения. Все гости были в восторге! Спасибо Donutopia за праздник!"</div><div class="review-author">— Алексей М.</div></div>
            <div class="review-card"><div class="review-stars">★★★★★</div><div class="review-text">"Обожаю клубничные пончики! Заказываю уже 3-й раз. Всегда свежие, мягкие, глазурь тает во рту."</div><div class="review-author">— Ольга В.</div></div>
        </div>

        <div style="background:var(--accent-soft); border-radius:40px; padding:40px; margin:40px 0; text-align:center">
            <h3>🍩 Готовы попробовать наши пончики?</h3>
            <p style="margin:15px 0">Сделайте заказ прямо сейчас и получите скидку 10% на первый заказ!</p>
            <button class="btn" id="toHomeFromAbout">🍩 Перейти к пончикам</button>
            <button class="btn" id="showDeveloperBtn" style="background:transparent; border:2px solid var(--primary); color:var(--primary); margin-left:15px"><i class="fas fa-code"></i> О разработчике</button>
        </div>
    `;
}

        function renderSupport() {
            if (!isAuthenticated()) return ``;
            return `<div class="section-title">📞 Поддержка</div>
            <div class="support-form-container">
                <p style="text-align:center; margin-bottom:25px; color:var(--text-muted);">Заполните форму, и мы свяжемся с вами в ближайшее время</p>
                <form id="supportForm">
                    <div class="support-form-group">
                        <label><i class="fas fa-user"></i> Ваше имя</label>
                        <input type="text" id="supportName" placeholder="Например: Анна" value="${currentUser?.name || ''}" required>
                    </div>
                    <div class="support-form-group">
                        <label><i class="fas fa-envelope"></i> Email для ответа</label>
                        <input type="email" id="supportEmail" placeholder="example@mail.com" value="${currentUser?.email || ''}" required>
                    </div>
                    <div class="support-form-group">
                        <label><i class="fas fa-tag"></i> Тема обращения</label>
                        <select id="supportTopic" required>
                            <option value="">Выберите тему</option>
                            <option value="order">❓ Вопрос по заказу</option>
                            <option value="delivery">🚚 Доставка</option>
                            <option value="product">🍩 Продукция</option>
                            <option value="other">💬 Другое</option>
                        </select>
                    </div>
                    <div class="support-form-group">
                        <label><i class="fas fa-comment"></i> Текст обращения</label>
                        <textarea id="supportMessage" placeholder="Опишите вашу проблему или вопрос подробно..." required></textarea>
                    </div>
                    <button type="submit" class="btn" style="width:100%"><i class="fas fa-paper-plane"></i> Отправить обращение</button>
                    <div id="supportResult"></div>
                </form>
            </div>`;
        }

        let loginError = null;

        function renderLogin() {
            if (isAuthenticated()) {
                setPage('home');
                return '';
            }
            return `<div class="login-container">
                <div class="login-header">
                    <i class="fas fa-donut"></i>
                    <h2>Добро пожаловать!</h2>
                    <p>Войдите или создайте аккаунт</p>
                </div>
                <div class="login-form">
                    ${loginError ? `<div class="error-message"><i class="fas fa-exclamation-circle"></i> ${loginError}</div>` : ''}
                    <form id="authForm">
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" id="regName" placeholder="Ваше имя" required>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="regEmail" placeholder="Email" required>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="regPassword" placeholder="Пароль (мин 4 символа)" required>
                        </div>
                        <button type="submit" class="btn login-btn"><i class="fas fa-sign-in-alt"></i> Войти / Зарегистрироваться</button>
                    </form>
                </div>
                <div class="login-footer">
                    <p>🍩 После входа вам откроются корзина, избранное и поддержка</p>
                </div>
            </div>`;
        }

        function renderPage(page) {
            if (page === 'home') return renderHome();
            if (page === 'cart') return renderCartPage();
            if (page === 'favorites') return renderFavorites();
            if (page === 'news') return renderNews();
            if (page === 'about') return renderAbout();
            if (page === 'support') return renderSupport();
            if (page === 'login') return renderLogin();
            if (page === 'checkout') return renderCheckout();
            if (page === 'account') return renderAccount();
            return renderHome();
        }

        function showDeveloperCard() {
            document.getElementById('devModal').style.display = 'flex';
        }

        function closeDevModal() {
            document.getElementById('devModal').style.display = 'none';
        }

        function attachEvents() {
            document.querySelectorAll('.donut-card, .set-card').forEach(el => {
                let id = parseInt(el.dataset.id),
                    isSet = el.dataset.set === 'true';
                el.onclick = (e) => {
                    if (!e.target.closest('.cart-quantity') && !e.target.closest('.cart-remove')) showDetail(id, isSet);
                };
            });
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.onclick = () => {
                    currentCategory = btn.dataset.cat;
                    renderCurrentPage();
                };
            });
            document.querySelectorAll('.qty-minus, .qty-plus').forEach(btn => {
                let id = parseInt(btn.dataset.id),
                    isSet = btn.dataset.set === 'true',
                    delta = btn.classList.contains('qty-plus') ? 1 : -1;
                btn.onclick = () => updateQuantity(id, delta, isSet);
            });
            document.querySelectorAll('.cart-remove').forEach(btn => {
                btn.onclick = () => removeFromCart(parseInt(btn.dataset.id), btn.dataset.set === 'true');
            });
            document.getElementById('clearCartBtn')?.addEventListener('click', () => {
                cart = [];
                saveCart();
                renderCurrentPage();
            });
            document.getElementById('goToCheckoutBtn')?.addEventListener('click', () => setPage('checkout'));
            document.getElementById('backHome')?.addEventListener('click', () => setPage('home'));
            document.getElementById('toHomeFav')?.addEventListener('click', () => setPage('home'));
            document.getElementById('scrollToDonuts')?.addEventListener('click', () => {
                setPage('home');
                setTimeout(() => document.getElementById('catalogSection')?.scrollIntoView({
                    behavior: 'smooth'
                }), 100);
            });
            document.getElementById('showDeveloperBtn')?.addEventListener('click', showDeveloperCard);
            document.getElementById('logoutAccountBtn')?.addEventListener('click', () => {
                logoutUser();
            });
            document.getElementById('searchBtn')?.addEventListener('click', () => {
                searchQuery = document.getElementById('searchInput')?.value || '';
                if (currentPage === 'home') renderCurrentPage();
                else setPage('home');
            });
            document.getElementById('searchInput')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    searchQuery = e.target.value;
                    if (currentPage === 'home') renderCurrentPage();
                    else setPage('home');
                }
            });

            const authForm = document.getElementById('authForm');
            if (authForm) {
                authForm.onsubmit = (e) => {
                    e.preventDefault();
                    loginError = null;
                    const name = document.getElementById('regName')?.value.trim();
                    const email = document.getElementById('regEmail')?.value.trim();
                    const pwd = document.getElementById('regPassword')?.value;
                    if (!name || !email || !pwd) {
                        loginError = "Заполните все поля!";
                        renderCurrentPage();
                        return;
                    }
                    if (pwd.length < 4) {
                        loginError = "Пароль должен быть не менее 4 символов!";
                        renderCurrentPage();
                        return;
                    }
                    loginUser(email, name);
                };
            }

            const deliveryForm = document.getElementById('deliveryForm');
            if (deliveryForm) {
                const deliverySelect = document.getElementById('deliveryType');
                const updateTotal = () => {
                    let subtotal = cart.reduce((s, i) => s + (getItemById(i.id, i.isSet)?.price || 0) * i.quantity, 0);
                    let cost = deliverySelect.value === 'city' ? 3 : 5;
                    document.getElementById('deliveryCost').innerText = cost + " Br";
                    document.getElementById('totalCost').innerText = (subtotal + cost).toFixed(2) + " Br";
                };
                deliverySelect.onchange = updateTotal;
                updateTotal();
                deliveryForm.onsubmit = (e) => {
                    e.preventDefault();
                    alert("✅ Заказ оформлен! Спасибо за покупку!");
                    cart = [];
                    saveCart();
                    setPage('home');
                };
            }

            const supportForm = document.getElementById('supportForm');
            if (supportForm) {
                supportForm.onsubmit = (e) => {
                    e.preventDefault();
                    const name = document.getElementById('supportName')?.value;
                    const email = document.getElementById('supportEmail')?.value;
                    const topic = document.getElementById('supportTopic')?.value;
                    const message = document.getElementById('supportMessage')?.value;
                    if (!name || !email || !topic || !message) {
                        alert("Заполните все поля!");
                        return;
                    }
                    document.getElementById('supportResult').innerHTML = '<div class="support-success"><i class="fas fa-check-circle"></i> Ваше обращение отправлено! Мы ответим вам в ближайшее время.</div>';
                    supportForm.reset();
                    if (currentUser) {
                        document.getElementById('supportName').value = currentUser.name;
                        document.getElementById('supportEmail').value = currentUser.email;
                    }
                    setTimeout(() => {
                        document.getElementById('supportResult').innerHTML = '';
                    }, 5000);
                };
            }
        }

        function renderCurrentPage() {
            loadUserData();
            document.getElementById('app').innerHTML = renderPage(currentPage);
            attachEvents();
        }

        function setPage(page) {
            currentPage = page;
            loginError = null;
            renderCurrentPage();
            window.scrollTo(0, 0);
        }

        // Модалка деталей
        const modalDiv = document.createElement('div');
        modalDiv.id = 'detailModal';
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `<div class="modal-content"><div style="text-align:right;"><button id="closeModalBtn" style="background:none; border:none; font-size:28px;">&times;</button></div><div id="detailImage" class="detail-img"></div><h2 id="detailTitle"></h2><p id="detailFullDesc"></p><div class="price" id="detailPrice"></div><div class="detail-actions"><button class="btn" id="modalAddToCartBtn">В корзину</button><button class="fav-detail-btn" id="modalFavBtn">В избранное</button></div></div>`;
        document.body.appendChild(modalDiv);
        document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
        window.onclick = (e) => {
            if (e.target === document.getElementById('detailModal')) closeModal();
        };
        document.getElementById('modalAddToCartBtn')?.addEventListener('click', () => {
            if (selectedItem) {
                addToCart(selectedItem.id, selectedItem.isSet);
                closeModal();
            }
        });
        document.getElementById('modalFavBtn')?.addEventListener('click', () => {
            if (selectedItem) toggleFavorite(selectedItem.id, selectedItem.isSet);
        });

        // Модалка разработчика
        const devModal = document.createElement('div');
        devModal.id = 'devModal';
        devModal.className = 'modal';
        devModal.innerHTML = `<div class="modal-content" style="max-width:500px; overflow-y: visible;">
            <div style="text-align:right;"><button id="closeDevModal" style="background:none; border:none; font-size:28px; cursor:pointer;">&times;</button></div>
            <div class="dev-card">
                <div style="background: linear-gradient(135deg, var(--primary-light), var(--accent-soft)); border-radius: 30px; padding: 25px;">
                    <img src="images/me.jpg" class="dev-photo" onerror="this.style.display='none'; this.nextSibling.style.display='flex';" onload="this.nextSibling.style.display='none'">
                    <div style="width:120px;height:120px;margin:0 auto;background:var(--bg-body);border-radius:60px;display:none;align-items:center;justify-content:center;border:4px solid var(--primary);"><i class="fas fa-code" style="font-size:48px;color:var(--primary);"></i></div>
                    <div class="dev-name">Цурко Ульяна</div>
                    <div class="dev-specialty"><i class="fas fa-laptop-code"></i> Разработчик ПО</div>
                    <table class="dev-table">
                        <tr><td><i class="fas fa-graduation-cap"></i> Код специальности</td><td><strong>5-04-0612-02</strong></td></tr>
                        <tr><td><i class="fas fa-book"></i> Специальность</td><td><strong>Разработка программного обеспечения информационных систем</strong></td></tr>
                        <tr><td><i class="fas fa-user-graduate"></i> ФИО</td><td><strong>Цурко Ульяна Васильевна</strong></td></tr>
                        <tr><td><i class="fas fa-donut"></i> Тема сайта</td><td><strong>Онлайн-магазин пончиков</strong></td></tr>
                        <tr><td><i class="fas fa-calendar-alt"></i> Дата создания</td><td><strong>15.05.2026</strong></td></tr>
                    </table>
                    <div class="dev-badge"><i class="fas fa-heart"></i> Сделано с любовью к пончикам 🍩</div>
                </div>
            </div>
        </div>`;
        document.body.appendChild(devModal);
        document.getElementById('closeDevModal')?.addEventListener('click', closeDevModal);
        window.onclick = (e) => {
            if (e.target === document.getElementById('devModal')) closeDevModal();
        };

        const themeBtn = document.getElementById('themeBtn');
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
        themeBtn.onclick = () => {
            document.body.classList.toggle('dark');
            localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
        };
        document.querySelectorAll('[data-page]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                setPage(link.dataset.page);
            });
        });

        const imgTest = new Image();
        imgTest.src = 'images/fon.jpg';
        imgTest.onerror = () => document.body.classList.add('no-bg-image');
        updateAuthUI();
        setPage('home');
    </script>
</body>
</html>
